

# ============================================================
# LiveCoachHub — Docker Compose (Full AI Stack)
#
# Jalankan:  docker compose up --build
# Frontend:  http://localhost:3000
# Backend:   http://localhost:8000
# NLP:       http://localhost:8010
# LLM:       http://localhost:8020
# ============================================================

services:
  # ---- Backend API (FastAPI) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./AI:/app/AI:ro                    # Mount AI subprojects (read-only)
      - ./data:/app/data:ro                # Mount replay & product data
    environment:
      - NLP_SERVICE_URL=http://nlp:8010
      - LLM_SERVICE_URL=http://llm:8020
      # URL Secret Gist untuk auto-download .env (zero-config demo)
      # Ganti dengan URL raw Secret Gist Anda setelah dibuat
      - ENV_GIST_URL=https://gist.githubusercontent.com/HafizhHabiibi/31a94c2b7c8339df142ddc673b1a9ab3/raw/99b37f8f130232adcb65501765def80e793f8a72/.env
    depends_on:
      - nlp
    networks:
      - livecoach
    restart: unless-stopped

  # ---- Frontend (Vite/React → Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - livecoach
    restart: unless-stopped

  # ---- NLP Service (IndoBERT) ----
  nlp:
    build:
      context: ./AI/NLP                    # Context = AI/NLP/ agar data/ bisa di-copy
      dockerfile: fine-tuned-indobert/Dockerfile
    ports:
      - "8010:8010"
    volumes:
      - hf-cache-nlp:/root/.cache/huggingface   # Persist model cache
    command: python serve.py --host 0.0.0.0 --port 8010
    networks:
      - livecoach
    restart: unless-stopped

  # ---- LLM Service (Qwen2.5 + QLoRA) — Opsional ----
  # Hanya dijalankan jika LLM_PROVIDER=qlora (butuh GPU NVIDIA)
  # Aktifkan dengan: docker compose --profile qlora up --build
  # Default (tanpa --profile): menggunakan Gemini API, service ini TIDAK jalan
  llm:
    profiles: ["qlora"]
    build:
      context: ./AI/LLM
      dockerfile: Dockerfile
    ports:
      - "8020:8020"
    volumes:
      - hf-cache-llm:/root/.cache/huggingface   # Persist base model cache
    command: python serve_llm.py --host 0.0.0.0 --port 8020
    networks:
      - livecoach
    restart: unless-stopped

volumes:
  hf-cache-nlp:        # Cache NLP model agar tidak download ulang setiap restart
  hf-cache-llm:        # Cache Qwen base model (~3 GB)

networks:
  livecoach:
    driver: bridge
