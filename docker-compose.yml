version: "3.8"

services:
  # ---- Backend API (FastAPI) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./AI:/app/AI:ro                    # Mount AI subprojects (read-only)
      - ./data:/app/data:ro                # Mount replay & product data
    environment:
      - NLP_SERVICE_URL=http://nlp:8010
      - LLM_SERVICE_URL=http://llm:8020
    depends_on:
      - nlp
    networks:
      - livecoach

  # ---- Frontend (Vite/React → Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - livecoach

  # ---- NLP Service (IndoBERT) ----
  nlp:
    build:
      context: ./AI/NLP/fine-tuned-indobert
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    volumes:
      - ./AI/NLP/fine-tuned-indobert:/app
    command: python serve.py --port 8010
    networks:
      - livecoach

  # ---- LLM Service (QLoRA) ----
  # Uncomment ketika adapter sudah di-train
  # llm:
  #   build:
  #     context: ./ai/grounded_llm
  #   ports:
  #     - "8020:8020"
  #   networks:
  #     - livecoach

networks:
  livecoach:
    driver: bridge
