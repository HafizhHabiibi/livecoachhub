# ============================================================
# LiveCoachHub — Docker Compose GPU Override
#
# Gunakan file ini HANYA jika punya GPU NVIDIA.
# File ini menambahkan GPU passthrough ke service LLM.
#
# Cara pakai:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# ============================================================

services:
  llm:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
